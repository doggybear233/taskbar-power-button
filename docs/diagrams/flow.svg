<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="404" viewBox="0 0 1180 404" font-family="Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8352c"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#1c1f24">What a click does</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">Nothing irreversible happens until the countdown reaches zero.</text>

  <rect x="40" y="150" width="200" height="76" rx="12" fill="#f2f3f5" stroke="#d9dce1"/>
  <text x="140" y="182" font-size="14.5" font-weight="600" fill="#1c1f24" text-anchor="middle">Taskbar click</text>
  <text x="140" y="204" font-size="12.5" fill="#6b7280" text-anchor="middle">the shortcut runs the exe</text>

  <line x1="240" y1="188" x2="296" y2="188" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="300" y="150" width="230" height="76" rx="12" fill="#fff5e8" stroke="#e8b463"/>
  <text x="415" y="182" font-size="14.5" font-weight="600" fill="#1c1f24" text-anchor="middle">Countdown window</text>
  <text x="415" y="204" font-size="12.5" fill="#8a6415" text-anchor="middle">5 s by default · nothing scheduled yet</text>

  <path d="M 415 150 C 415 112, 480 106, 552 106" fill="none" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="556" y="74" width="252" height="64" rx="12" fill="#eef7f0" stroke="#a7d3b4"/>
  <text x="682" y="100" font-size="14.5" font-weight="600" fill="#1c1f24" text-anchor="middle">Cancelled</text>
  <text x="682" y="121" font-size="12.5" fill="#3f6b4d" text-anchor="middle">click again · Esc · 中止 — exits cleanly</text>
  <text x="556" y="160" font-size="12" fill="#6b7280">Windows was never asked to</text>
  <text x="556" y="177" font-size="12" fill="#6b7280">shut down, so nothing to undo</text>

  <path d="M 415 226 C 415 258, 480 264, 552 264" fill="none" stroke="#c8352c" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <rect x="556" y="228" width="290" height="72" rx="12" fill="#fdeceb" stroke="#e6a19b"/>
  <text x="701" y="256" font-size="14" font-weight="600" fill="#1c1f24" text-anchor="middle">ExitWindowsEx(EWX_SHUTDOWN)</text>
  <text x="701" y="278" font-size="12.5" fill="#8c2f27" text-anchor="middle">SeShutdownPrivilege · no grace-period dialog</text>

  <line x1="846" y1="264" x2="892" y2="264" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="896" y="232" width="176" height="64" rx="12" fill="#f2f3f5" stroke="#d9dce1"/>
  <text x="984" y="259" font-size="14.5" font-weight="600" fill="#1c1f24" text-anchor="middle">Session ends</text>
  <text x="984" y="280" font-size="12.5" fill="#6b7280" text-anchor="middle">apps save or block, as usual</text>

  <rect x="40" y="330" width="1032" height="58" rx="10" fill="#fafbfc" stroke="#e5e7eb"/>
  <text x="60" y="354" font-size="12.5" fill="#4b5563">Why not <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="12">shutdown.exe /s /t 5</tspan> straight away? Any <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="12">/t</tspan> above zero makes Windows show its own “shutting down in</text>
  <text x="60" y="375" font-size="12.5" fill="#4b5563">less than a minute” dialog and implies <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="12">/f</tspan>. Counting down locally keeps the UI ours and the cancel instant.</text>
</svg>
